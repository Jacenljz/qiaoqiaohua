<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>悄悄话</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --bg:#eef0f4;
    --surface:#ffffff;
    --surface-2:#e4e7ee;
    --border:#d5d9e3;
    --text:#23283a;
    --text-dim:#6b7086;
    --accent-w:#3f8672;
    --accent-w-ink:#ffffff;
    --accent-a:#b8763a;
    --accent-a-ink:#ffffff;
    --danger:#b3455a;
    --online:#2f9e63;
    --shadow: 0 20px 44px -24px rgba(30,32,50,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14151d; --surface:#1c1e29; --surface-2:#262838; --border:#34364a;
      --text:#eceef5; --text-dim:#9498ab;
      --accent-w:#5fad96; --accent-w-ink:#0d1512;
      --accent-a:#d99a5c; --accent-a-ink:#231405;
      --danger:#e08096;
      --online:#57c78c;
      --shadow: 0 20px 44px -20px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14151d; --surface:#1c1e29; --surface-2:#262838; --border:#34364a;
    --text:#eceef5; --text-dim:#9498ab;
    --accent-w:#5fad96; --accent-w-ink:#0d1512;
    --accent-a:#d99a5c; --accent-a-ink:#231405;
    --danger:#e08096;
      --online:#57c78c;
    --shadow: 0 20px 44px -20px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:stretch;
  }
  .frame{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow);
  } 
  @media (min-width:520px){
    body{ padding:28px 12px; align-items:center; }
    .frame{ min-height:min(780px, calc(100vh - 56px)); height:min(780px, calc(100vh - 56px)); border-radius:22px; overflow:hidden; border:1px solid var(--border); }
  }

  h1,h2{ font-family:'ZCOOL XiaoWei', 'Noto Sans SC', serif; font-weight:400; text-wrap:balance; margin:0; }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }

  /* ---------- Login view ---------- */
  #login-view{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:22px; padding:40px 32px; overflow-y:auto; }
  .brand{ text-align:center; display:flex; flex-direction:column; gap:8px; }
  .brand h1{ font-size:2.1rem; letter-spacing:.04em; }
  .brand p{ margin:0; color:var(--text-dim); font-size:.92rem; }

  .identity-toggle{ display:flex; gap:10px; background:var(--surface-2); padding:6px; border-radius:14px; border:1px solid var(--border); }
  .identity-toggle button{
    flex:1; border:none; background:transparent; color:var(--text-dim); font:inherit; font-weight:600;
    padding:12px 8px; border-radius:10px; cursor:pointer;
    transition:background .15s ease, color .15s ease, box-shadow .15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .identity-toggle button .dot{ width:9px; height:9px; border-radius:50%; background:currentColor; opacity:.55; }
  .identity-toggle button[data-id="W"].active{ background:var(--accent-w); color:var(--accent-w-ink); box-shadow:0 8px 18px -10px color-mix(in srgb, var(--accent-w) 70%, transparent); }
  .identity-toggle button[data-id="A"].active{ background:var(--accent-a); color:var(--accent-a-ink); box-shadow:0 8px 18px -10px color-mix(in srgb, var(--accent-a) 70%, transparent); }
  .identity-toggle button.active .dot{ opacity:1; }

  .field{ display:flex; flex-direction:column; gap:8px; }
  .field label{ font-size:.8rem; color:var(--text-dim); letter-spacing:.03em; }
  .field-hint{ font-size:.74rem; color:var(--text-dim); margin:0; line-height:1.4; }
  .masked-field{ position:relative; display:flex; align-items:center; }
  .masked-field input{
    width:100%; font:inherit; font-size:1rem; padding:13px 42px 13px 14px; border-radius:11px;
    border:1px solid var(--border); background:var(--bg); color:var(--text); outline:none;
    transition:border-color .15s ease;
    -webkit-text-security: disc;
  }
  .masked-field input.revealed{ -webkit-text-security: none; }
  .masked-field input:focus{ border-color:var(--text-dim); }
  .reveal-btn{
    position:absolute; right:6px; width:32px; height:32px; border-radius:8px; border:none;
    background:transparent; color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .reveal-btn:hover{ color:var(--text); background:var(--surface-2); }

  #login-submit{
    font:inherit; font-weight:600; font-size:1rem; padding:14px; border-radius:11px; border:none;
    background:var(--text); color:var(--surface); cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  #login-submit:hover{ opacity:.88; }
  #login-submit:active{ transform:scale(.99); }
  #login-submit:disabled{ opacity:.5; cursor:default; }
  #login-submit:focus-visible, .identity-toggle button:focus-visible, #send-btn:focus-visible,
  #logout-btn:focus-visible, #forget-btn:focus-visible, .reveal-btn:focus-visible{
    outline:2px solid var(--text-dim); outline-offset:2px;
  }

  .login-msg{ min-height:1.2em; font-size:.85rem; text-align:center; color:var(--danger); }
  .login-msg.notice{ color:var(--text-dim); }

  /* ---------- Chat view ---------- */
  #chat-view{ flex:1; display:flex; flex-direction:column; min-height:0; }
  header.bar{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px; border-bottom:1px solid var(--border); background:var(--surface); }
  .bar-title{ display:flex; flex-direction:column; min-width:0; }
  .bar-title h2{ font-size:1.15rem; }
  .bar-title span{ font-size:.74rem; color:var(--text-dim); }
  .bar-title .presence{ display:flex; align-items:center; gap:6px; }
  .dot-live{ width:7px; height:7px; border-radius:50%; background:var(--text-dim); opacity:.4; flex:none; }
  .dot-live.online{ background:var(--online); opacity:1; box-shadow:0 0 0 3px color-mix(in srgb, var(--online) 22%, transparent); }
  .bar-title .sep{ opacity:.45; }
  .bar-actions{ display:flex; gap:6px; flex:none; }
  .bar-actions button{
    font:inherit; font-size:.74rem; color:var(--text-dim); background:var(--surface-2);
    border:1px solid var(--border); padding:6px 10px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .bar-actions button:hover{ color:var(--text); }

  #messages{ flex:1; overflow-y:auto; padding:18px 16px 10px; display:flex; flex-direction:column; gap:10px; background:var(--bg); }
  .day-divider{ align-self:center; font-size:.72rem; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border); padding:3px 12px; border-radius:999px; margin:6px 0; }
  .sys-note{ align-self:center; font-size:.76rem; color:var(--text-dim); text-align:center; max-width:80%; }
  .msg-row{ display:flex; align-items:flex-end; gap:8px; max-width:74%; }
  .msg-row.own{ align-self:flex-end; flex-direction:row-reverse; }
  .msg-row.other{ align-self:flex-start; }
  .avatar{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; flex:none; font-family:'JetBrains Mono', monospace; }
  .msg-row.other .avatar{ background:var(--accent-w); color:var(--accent-w-ink); }
  .msg-row.other.sender-A .avatar{ background:var(--accent-a); color:var(--accent-a-ink); }
  /* inline-flex + fit-content: the bubble hugs its own text width instead of
     inheriting the block-flex shrink algorithm, which is what was collapsing
     CJK text (breakable at every character) down to one glyph per line. */
  .msg-col{ display:inline-flex; flex-direction:column; gap:3px; width:fit-content; max-width:100%; min-width:0; }
  .msg-row.own .msg-col{ align-items:flex-end; }
  .bubble{ padding:10px 13px; border-radius:16px; font-size:.95rem; line-height:1.48; white-space:pre-wrap; overflow-wrap:break-word; }
  .msg-row.other .bubble{ background:var(--surface-2); color:var(--text); border-bottom-left-radius:5px; }
  .msg-row.own .bubble{ border-bottom-right-radius:5px; }
  .msg-row.own.sender-W .bubble{ background:var(--accent-w); color:var(--accent-w-ink); }
  .msg-row.own.sender-A .bubble{ background:var(--accent-a); color:var(--accent-a-ink); }
  .bubble.broken{ background:var(--surface-2) !important; color:var(--text-dim) !important; font-style:italic; }
  .msg-time{ font-size:.68rem; color:var(--text-dim); padding:0 3px; }

  #composer{ display:flex; align-items:flex-end; gap:10px; padding:12px 14px; border-top:1px solid var(--border); background:var(--surface); }
  #msg-input{ flex:1; resize:none; font:inherit; font-size:.95rem; line-height:1.4; max-height:120px; padding:11px 14px; border-radius:16px; border:1px solid var(--border); background:var(--bg); color:var(--text); outline:none; }
  #msg-input:focus{ border-color:var(--text-dim); }
  #send-btn{ flex:none; width:42px; height:42px; border-radius:50%; border:none; background:var(--text); color:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:opacity .15s ease, transform .1s ease; }
  #send-btn:hover{ opacity:.88; }
  #send-btn:active{ transform:scale(.94); }
  #send-btn:disabled{ opacity:.4; cursor:default; }

  .conn-banner{ font-size:.78rem; text-align:center; color:var(--danger); padding:7px; background:color-mix(in srgb, var(--danger) 12%, var(--surface)); border-bottom:1px solid var(--border); display:none; }
  .conn-banner.show{ display:block; }

  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<div class="frame">

  <section id="login-view">
    <div class="brand">
      <h1>悄悄话</h1>
      <p>只有 W 和 Aphrissa 能进来的地方</p>
    </div>

    <div class="identity-toggle" role="group" aria-label="选择身份">
      <button type="button" data-id="W" class="active"><span class="dot"></span>W</button>
      <button type="button" data-id="A"><span class="dot"></span>Aphrissa</button>
    </div>

    <div class="field">
      <label for="pw-input">账号密码</label>
      <div class="masked-field">
        <input id="pw-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入你的密码" />
        <button type="button" class="reveal-btn" data-target="pw-input" aria-label="显示/隐藏密码">👁</button>
      </div>
    </div>

    <div class="field" id="passphrase-field">
      <label for="pp-input">加密口令</label>
      <div class="masked-field">
        <input id="pp-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="只有你们俩知道的一句话" />
        <button type="button" class="reveal-btn" data-target="pp-input" aria-label="显示/隐藏口令">👁</button>
      </div>
      <p class="field-hint">用来给消息加密的口令，和账号密码不是一回事，两边必须完全一样。这句话只留在你们各自的浏览器里，不会发给服务器，也不会告诉我。</p>
    </div>

    <button id="login-submit" type="button">进门</button>
    <p class="login-msg" id="login-msg"></p>
  </section>

  <section id="chat-view" hidden>
    <div class="conn-banner" id="conn-banner">实时同步已断开，请刷新页面重试</div>
    <header class="bar">
      <div class="bar-title">
        <h2>W &amp; Aphrissa</h2>
        <span class="presence">
          <i class="dot-live" id="peer-dot"></i>
          <span id="peer-status">连接中…</span>
          <span class="sep">·</span>
          <span id="whoami"></span>
        </span>
      </div>
      <div class="bar-actions">
        <button id="forget-btn" type="button">更换口令</button>
        <button id="logout-btn" type="button">切换账号</button>
      </div>
    </header>

    <div id="messages"></div>

    <form id="composer">
      <textarea id="msg-input" rows="1" placeholder="说点什么…" maxlength="2000"></textarea>
      <button id="send-btn" type="submit" aria-label="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3.4 20.6l18.2-8.6-18.2-8.6 0 6.9 12.5 1.7-12.5 1.7z" fill="currentColor"/></svg>
      </button>
    </form>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, setPersistence, browserLocalPersistence,
  signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  initializeFirestore, collection, addDoc, doc, setDoc, deleteDoc,
  query, orderBy, limit, onSnapshot, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCW-3z9eYzajPeyqVjn6-4_hYv8N2XRKow",
  authDomain: "prts-a5324.firebaseapp.com",
  projectId: "prts-a5324",
  storageBucket: "prts-a5324.firebasestorage.app",
  messagingSenderId: "352484709561",
  appId: "1:352484709561:web:1e5b6322a038f4cbfd7768"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
// experimentalAutoDetectLongPolling: fall back to plain long-polling HTTPS
// requests when the network (e.g. a strict corporate proxy/firewall) blocks
// Firestore's normal streaming connection — this is what "real-time sync
// works on hotspot but not on office wifi" almost always means.
const fs = initializeFirestore(fbApp, {
  experimentalAutoDetectLongPolling: true,
  useFetchStreams: false
});

const ACCOUNTS = {
  W: { id: 'W', name: 'W', email: 'w@prts.com', uid: 'l02qdioKiqdss321ftpkuvefVyy1' },
  A: { id: 'A', name: 'Aphrissa', email: 'aphrissa@prts.com', uid: 'VGMKxla5qMaCwFbFrtmowrZXrms1' }
};
const PASSPHRASE_KEY = 'prts_passphrase_v1';
const PBKDF2_SALT = 'prts-qiaoqiaohua-salt-v1';
const MSG_PATH = ['rooms', 'main', 'messages'];
const PRESENCE_PATH = ['rooms', 'main', 'presence'];
const HEARTBEAT_MS = 45000;      // one small write per open tab per 45s
const ONLINE_WINDOW_MS = 120000; // peer reads as online if seen within 2 min

(function(){
  "use strict";

  const loginView = document.getElementById('login-view');
  const chatView = document.getElementById('chat-view');
  const toggleBtns = document.querySelectorAll('.identity-toggle button');
  const pwInput = document.getElementById('pw-input');
  const ppField = document.getElementById('passphrase-field');
  const ppInput = document.getElementById('pp-input');
  const loginSubmit = document.getElementById('login-submit');
  const loginMsg = document.getElementById('login-msg');
  const whoami = document.getElementById('whoami');
  const peerDot = document.getElementById('peer-dot');
  const peerStatus = document.getElementById('peer-status');
  const logoutBtn = document.getElementById('logout-btn');
  const forgetBtn = document.getElementById('forget-btn');
  const messagesEl = document.getElementById('messages');
  const composer = document.getElementById('composer');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const connBanner = document.getElementById('conn-banner');

  let selectedId = 'W';
  let currentUser = null;
  let cryptoKey = null;
  let unsubscribe = null;
  let pruning = false;
  let presenceUnsub = null;
  let heartbeatTimer = null;
  let statusTicker = null;
  let peerLastSeen = 0;
  let peerKnown = false;
  let seenInitial = false;
  let lastMsgTs = 0;
  let hasUnread = false;

  // ---- reveal/hide password-like fields (supports Chinese IME) ----
  document.querySelectorAll('.reveal-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      const target = document.getElementById(btn.getAttribute('data-target'));
      target.classList.toggle('revealed');
    });
  });

  toggleBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      selectedId = btn.getAttribute('data-id');
      toggleBtns.forEach(function(b){ b.classList.toggle('active', b === btn); });
      setLoginNotice('');
    });
  });

  function setLoginNotice(text, isNotice){
    loginMsg.textContent = text || '';
    loginMsg.classList.toggle('notice', !!isNotice);
  }

  function hasCachedPassphrase(){
    try { return !!localStorage.getItem(PASSPHRASE_KEY); } catch(e){ return false; }
  }
  function getCachedPassphrase(){
    try { return localStorage.getItem(PASSPHRASE_KEY); } catch(e){ return null; }
  }
  function setCachedPassphrase(v){
    try { localStorage.setItem(PASSPHRASE_KEY, v); } catch(e){}
  }
  function clearCachedPassphrase(){
    try { localStorage.removeItem(PASSPHRASE_KEY); } catch(e){}
  }

  function refreshPassphraseFieldVisibility(){
    ppField.hidden = hasCachedPassphrase();
  }
  refreshPassphraseFieldVisibility();

  // ---- Web Crypto: derive AES-GCM key from shared passphrase ----
  async function deriveKey(passphrase){
    const enc = new TextEncoder();
    const material = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: enc.encode(PBKDF2_SALT), iterations: 150000, hash: 'SHA-256' },
      material,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }
  function bufToB64(buf){
    let bin = '';
    const bytes = new Uint8Array(buf);
    for (let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64ToBuf(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function encryptText(text){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder().encode(text);
    const ctBuf = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, cryptoKey, enc);
    return { iv: bufToB64(iv), ct: bufToB64(ctBuf) };
  }
  async function decryptText(ivB64, ctB64){
    const iv = b64ToBuf(ivB64);
    const ct = b64ToBuf(ctB64);
    const ptBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, cryptoKey, ct);
    return new TextDecoder().decode(ptBuf);
  }

  // ---- login ----
  async function attemptLogin(){
    const acc = ACCOUNTS[selectedId];
    const pw = pwInput.value;
    const cached = hasCachedPassphrase();
    const pp = cached ? getCachedPassphrase() : ppInput.value;

    if (!pw){ setLoginNotice('请输入账号密码'); return; }
    if (!pp){ setLoginNotice('请输入加密口令'); return; }

    loginSubmit.disabled = true;
    setLoginNotice('正在进门…', true);
    try {
      await setPersistence(auth, browserLocalPersistence);
      const cred = await signInWithEmailAndPassword(auth, acc.email, pw);
      if (cred.user.uid !== acc.uid){
        await signOut(auth);
        setLoginNotice('这个账号身份对不上，联系一下写代码的人');
        loginSubmit.disabled = false;
        return;
      }
      currentUser = acc;
      if (!cached) setCachedPassphrase(pp);
      cryptoKey = await deriveKey(pp);
      enterChat();
    } catch (err){
      setLoginNotice('密码不对哦，再试一次');
      pwInput.value = '';
    } finally {
      loginSubmit.disabled = false;
    }
  }

  loginSubmit.addEventListener('click', attemptLogin);
  [pwInput, ppInput].forEach(function(el){
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); attemptLogin(); }
    });
  });

  logoutBtn.addEventListener('click', async function(){
    if (unsubscribe){ unsubscribe(); unsubscribe = null; }
    await stopPresence();
    try { await signOut(auth); } catch(e){}
    currentUser = null;
    cryptoKey = null;
    pwInput.value = '';
    setLoginNotice('');
    refreshPassphraseFieldVisibility();
    chatView.hidden = true;
    loginView.hidden = false;
  });

  forgetBtn.addEventListener('click', async function(){
    if (unsubscribe){ unsubscribe(); unsubscribe = null; }
    await stopPresence();
    try { await signOut(auth); } catch(e){}
    clearCachedPassphrase();
    currentUser = null;
    cryptoKey = null;
    pwInput.value = '';
    ppInput.value = '';
    setLoginNotice('已清空口令缓存，重新登录并输入新的加密口令吧', true);
    refreshPassphraseFieldVisibility();
    chatView.hidden = true;
    loginView.hidden = false;
  });

  function enterChat(){
    if (unsubscribe) return; // already connected — avoid a duplicate Firestore listener
    loginView.hidden = true;
    chatView.hidden = false;
    whoami.textContent = '你是 ' + currentUser.name;
    messagesEl.innerHTML = '';
    connectFirestore();
    startPresence();
    msgInput.focus();
  }

  // ---- unread badge: a red dot on the tab icon while you are looking elsewhere ----
  const faviconLink = document.querySelector('link[rel="icon"]');
  const MOON_SVG = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text>";
  const ICON_PLAIN = 'data:image/svg+xml,' + encodeURIComponent(MOON_SVG + '</svg>');
  const ICON_UNREAD = 'data:image/svg+xml,' + encodeURIComponent(
    MOON_SVG + "<circle cx='18' cy='18' r='17' fill='#e8483f' stroke='#ffffff' stroke-width='7'/></svg>"
  );

  function setUnreadBadge(on){
    if (faviconLink) faviconLink.href = on ? ICON_UNREAD : ICON_PLAIN;
  }

  function clearUnread(){
    if (hasUnread){ hasUnread = false; setUnreadBadge(false); }
  }

  // hidden tab, or a focused tab in a window sitting behind another app
  function lookingAway(){
    return document.hidden || !document.hasFocus();
  }

  function noteIncoming(docs){
    const newest = docs.length ? docs[docs.length - 1].ts : 0;
    if (!seenInitial){ seenInitial = true; lastMsgTs = newest; return; }
    if (newest <= lastMsgTs) return;
    const peerUid = peerAccount().uid;
    const fromPeer = docs.some(function(m){ return m.ts > lastMsgTs && m.senderUid === peerUid; });
    lastMsgTs = newest;
    if (fromPeer && lookingAway()){
      hasUnread = true;
      setUnreadBadge(true);
    }
  }

  document.addEventListener('visibilitychange', function(){ if (!document.hidden) clearUnread(); });
  window.addEventListener('focus', clearUnread);

  // ---- presence: each person heartbeats one doc, the other reads it live ----
  function peerAccount(){
    return currentUser.id === 'W' ? ACCOUNTS.A : ACCOUNTS.W;
  }

  function startPresence(){
    peerKnown = false;
    peerLastSeen = 0;
    const meRef = doc(fs, ...PRESENCE_PATH, currentUser.uid);
    const beat = function(){
      setDoc(meRef, { lastSeen: Date.now(), who: currentUser.id })
        .catch(function(e){ console.error('[qiaoqiaohua] heartbeat failed:', e); });
    };
    beat();
    heartbeatTimer = setInterval(beat, HEARTBEAT_MS);

    presenceUnsub = onSnapshot(doc(fs, ...PRESENCE_PATH, peerAccount().uid), function(snap){
      const d = snap.data();
      peerLastSeen = (d && typeof d.lastSeen === 'number') ? d.lastSeen : 0;
      peerKnown = true;
      renderPresence();
    }, function(err){
      console.error('[qiaoqiaohua] presence error:', err);
    });

    // lets the label decay to "离线" on its own, with no new data coming in
    statusTicker = setInterval(renderPresence, 15000);
    renderPresence();
  }

  async function stopPresence(){
    if (heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; }
    if (statusTicker){ clearInterval(statusTicker); statusTicker = null; }
    if (presenceUnsub){ presenceUnsub(); presenceUnsub = null; }
    peerLastSeen = 0;
    peerKnown = false;
    seenInitial = false;
    lastMsgTs = 0;
    clearUnread();
    if (currentUser){
      try {
        await setDoc(doc(fs, ...PRESENCE_PATH, currentUser.uid), { lastSeen: 0, who: currentUser.id });
      } catch(e){}
    }
  }

  function agoLabel(ms){
    const mins = Math.floor(ms / 60000);
    if (mins < 60) return Math.max(1, mins) + ' 分钟前';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' 小时前';
    return Math.floor(hours / 24) + ' 天前';
  }

  function renderPresence(){
    if (!currentUser) return;
    const peer = peerAccount();
    if (!peerKnown){
      peerDot.classList.remove('online');
      peerStatus.textContent = '连接中…';
      return;
    }
    const online = peerLastSeen > 0 && (Date.now() - peerLastSeen) < ONLINE_WINDOW_MS;
    peerDot.classList.toggle('online', online);
    if (online){
      peerStatus.textContent = peer.name + ' 在线';
    } else if (peerLastSeen > 0){
      peerStatus.textContent = peer.name + ' ' + agoLabel(Date.now() - peerLastSeen) + '在线';
    } else {
      peerStatus.textContent = peer.name + ' 不在线';
    }
  }

  // ---- date / time formatting ----
  function dayKey(ts){ const d = new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function dayLabel(ts){
    const d = new Date(ts), now = new Date();
    const todayKey = dayKey(now.getTime()), k = dayKey(ts);
    if (k === todayKey) return '今天';
    const yest = new Date(now); yest.setDate(now.getDate()-1);
    if (k === dayKey(yest.getTime())) return '昨天';
    return (d.getMonth()+1)+'月'+d.getDate()+'日';
  }
  function timeLabel(ts){
    const d = new Date(ts), h=d.getHours(), m=d.getMinutes();
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }

  function idFromUid(uid){
    if (uid === ACCOUNTS.W.uid) return 'W';
    if (uid === ACCOUNTS.A.uid) return 'A';
    return null;
  }

  async function renderMessages(rawDocs){
    const atBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 40;
    const resolved = await Promise.all(rawDocs.map(async function(m){
      const senderId = idFromUid(m.senderUid) || '?';
      let text, broken = false;
      try { text = await decryptText(m.iv, m.ct); }
      catch(e){ text = '🔒 无法解密（加密口令和对方不一致）'; broken = true; }
      return { senderId, text, broken, ts: m.ts };
    }));

    messagesEl.innerHTML = '';
    let lastDay = null;
    resolved.forEach(function(m){
      const dk = dayKey(m.ts);
      if (dk !== lastDay){
        const div = document.createElement('div');
        div.className = 'day-divider mono';
        div.textContent = dayLabel(m.ts);
        messagesEl.appendChild(div);
        lastDay = dk;
      }
      const isOwn = m.senderId === currentUser.id;
      const row = document.createElement('div');
      row.className = 'msg-row ' + (isOwn ? 'own' : 'other') + ' sender-' + m.senderId;

      if (!isOwn){
        const av = document.createElement('div');
        av.className = 'avatar';
        av.textContent = m.senderId;
        row.appendChild(av);
      }

      const col = document.createElement('div');
      col.className = 'msg-col';
      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (m.broken ? ' broken' : '');
      bubble.textContent = m.text;
      const time = document.createElement('div');
      time.className = 'msg-time mono';
      time.textContent = timeLabel(m.ts);
      col.appendChild(bubble);
      col.appendChild(time);
      row.appendChild(col);
      messagesEl.appendChild(row);
    });

    if (atBottom || resolved.length <= 1) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function pruneIfNeeded(count){
    if (pruning || count < 500) return;
    pruning = true;
    const q = query(collection(fs, ...MSG_PATH), orderBy('ts', 'asc'), limit(150));
    getDocs(q).then(function(snap){
      const dels = [];
      snap.forEach(function(d){ dels.push(deleteDoc(doc(fs, ...MSG_PATH, d.id))); });
      return Promise.all(dels);
    }).catch(function(){}).finally(function(){ pruning = false; });
  }

  function connectFirestore(){
    const q = query(collection(fs, ...MSG_PATH), orderBy('ts', 'desc'), limit(400));
    unsubscribe = onSnapshot(q, function(snap){
      connBanner.classList.remove('show');
      const docs = [];
      snap.forEach(function(d){ docs.push(d.data()); });
      docs.reverse();
      noteIncoming(docs);
      renderMessages(docs);
      pruneIfNeeded(docs.length);
    }, function(err){
      console.error('[qiaoqiaohua] sync error:', err);
      connBanner.classList.add('show');
    });
  }

  composer.addEventListener('submit', function(e){ e.preventDefault(); sendCurrentMessage(); });
  msgInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendCurrentMessage(); }
  });
  msgInput.addEventListener('input', function(){
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });

  async function sendCurrentMessage(){
    const text = msgInput.value.trim();
    if (!text || !cryptoKey || !currentUser) return;
    sendBtn.disabled = true;
    try {
      const { iv, ct } = await encryptText(text);
      await addDoc(collection(fs, ...MSG_PATH), {
        senderUid: currentUser.uid,
        iv, ct,
        ts: Date.now()
      });
      msgInput.value = '';
      msgInput.style.height = 'auto';
    } catch(e){
      console.error('[qiaoqiaohua] send failed:', e);
      connBanner.classList.add('show');
    } finally {
      sendBtn.disabled = false;
      msgInput.focus();
    }
  }

  // ---- restore session on reload ----
  onAuthStateChanged(auth, async function(user){
    if (user && hasCachedPassphrase() && !currentUser){
      const acc = user.email === ACCOUNTS.W.email ? ACCOUNTS.W
                : user.email === ACCOUNTS.A.email ? ACCOUNTS.A : null;
      if (acc){
        currentUser = acc;
        cryptoKey = await deriveKey(getCachedPassphrase());
        enterChat();
      }
    }
  });

})();
</script>
